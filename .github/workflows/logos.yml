# Watches the team logos and flags: every week, and twice before each season
# starts, checks for constructors racing without a logo, for logos that have
# changed on Wikipedia and for drivers whose nationality has no flag (see
# scripts/logos.ts). Anything it finds is filed as one GitHub issue, updated
# in place on later runs and closed once all is well again. It never commits
# or opens branches.
name: Logos and flags

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays
    - cron: "17 6 1 2,3 *" # 1 February and 1 March, before the season
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Team logos or flags need attention
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run logos -- --check --report report.md
      - name: File, update or close the issue
        run: |
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -s report.md ]; then
            { cat report.md; printf '\n\n_From the [Logos workflow](%s/%s/actions/runs/%s)._\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"; } > body.md
            if [ -n "$issue" ]; then gh issue edit "$issue" --body-file body.md
            else gh issue create --title "$TITLE" --body-file body.md; fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Every logo and flag is up to date."
          fi
